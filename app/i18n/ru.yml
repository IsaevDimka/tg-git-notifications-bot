start.private_only: "Я работаю только в личных сообщениях — напиши мне напрямую."
start.hello: |-
  👋 <b>Привет!</b> Я слежу за твоими код-ревью в GitLab и GitHub и пишу, когда ход за тобой:
  • тебя назначили ревьюером
  • ответили на твой комментарий
  • в твоём MR новый комментарий, апрув или конфликт

  Подключи аккаунт — понадобится персональный токен.
