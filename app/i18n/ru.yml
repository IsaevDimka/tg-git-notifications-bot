ob.ask_host: "Пришли адрес своего GitLab, например <code>gitlab.company.com</code>."
ob.bad_host: "Не похоже на адрес GitLab. Пример: <code>gitlab.company.com</code>. Нажми «Свой GitLab» ещё раз."
ob.ask_token_gitlab: |-
  Создай токен со scope <b>api</b>: <a href="{url}">открыть настройки токенов</a>.
  Пришли его ответом на это сообщение — я сразу удалю сообщение с токеном из чата.
ob.ask_token_github: |-
  Создай classic-токен со scope <b>repo</b>: <a href="{url}">открыть настройки токенов</a>.
  Пришли его ответом на это сообщение — я сразу удалю сообщение с токеном из чата.
token.invalid: "❌ {host} не принял токен. Проверь, что скопировал его целиком, и попробуй ещё раз."
token.unreachable: "❌ Не достучался до {host}. Проверь адрес и что сервер доступен из интернета, потом попробуй ещё раз."
token.ok: "✅ Привет, <b>@{username}</b>! {host} подключён. Сейчас на твоём ревью MR: <b>{count}</b>."
token.readonly: "\n⚠️ У токена нет scope <b>{scope}</b> — уведомления будут, а кнопки «Ответить», «Approve» и «Resolve» работать не будут."
token.delete_failed: "\n⚠️ Не смог удалить сообщение с токеном — удали его вручную."
token.unexpected: "🔐 Похоже, это токен — удалил сообщение, чтобы он не остался в истории. Чтобы подключить аккаунт, нажми /start."
ob.ask_tz: "Последний шаг — твоя таймзона. От неё зависят тихие часы:"
btn.tz_other: "Другая…"
ob.ask_tz_text: "Пришли таймзону в формате IANA, например <code>Asia/Yekaterinburg</code>."
ob.bad_tz: "Не знаю такую таймзону. Пример: <code>Europe/Moscow</code>. Попробуй ещё раз через /settings."
ob.done: "🎉 Готово! Таймзона: <b>{tz}</b>. Буду писать, когда ход за тобой. Список MR — /mr, непрочитанное — /inbox, настройки — /settings."
hint.unknown_text: "Я понимаю только кнопки и команды. Список команд — /help."
help.text: |-
  <b>Команды</b>
  /inbox — где ход за тобой и что не прочитано
  /mr — все твои MR: на ревью и свои
  /my — только твои MR (автор или assignee)
  /accounts — подключённые GitLab и GitHub
  /settings — уведомления, ежедневная сводка, тихие часы, язык, таймзона
  /lang — сменить язык (RU / EN)
  /start — подключить ещё один аккаунт
