start.private_only: "I only work in private chats — message me directly."
start.hello: |-
  👋 <b>Hi!</b> I watch your code reviews on GitLab and GitHub and message you when it's your move:
  • you were asked to review a merge request
  • someone replied to your comment
  • your merge request got a comment, an approval or a conflict

  Connect an account — you'll need a personal access token.
btn.gitlab_com: "GitLab.com"
btn.gitlab_self: "Self-hosted GitLab"
btn.github: "GitHub"
access.pending: "⏳ I've asked this bot's admin to let you in. I'll message you once they approve."
access.approved: "✅ The admin let you in. Connect an account:"
access.rejected: "The admin declined your access request."
access.need_start: "Send /start first."
admin.request: "🙋 <b>{name}</b> (id <code>{tg_id}</code>) is asking for access."
admin.approved: "✅ {name} now has access."
admin.rejected: "🚫 Declined {name}'s request."
btn.admit: "✅ Let in"
btn.reject: "🚫 Decline"
ob.ask_host: "Send your GitLab address, e.g. <code>gitlab.company.com</code>."
ob.bad_host: "That doesn't look like a GitLab address. Example: <code>gitlab.company.com</code>. Tap “Self-hosted GitLab” to try again."
ob.ask_token_gitlab: |-
  Create a token with the <b>api</b> scope: <a href="{url}">open token settings</a>.
  Send it as a reply to this message — I'll delete your message with the token right away.
ob.ask_token_github: |-
  Create a classic token with the <b>repo</b> scope: <a href="{url}">open token settings</a>.
  Send it as a reply to this message — I'll delete your message with the token right away.
token.invalid: "❌ {host} rejected this token. Check that you copied all of it and try again."
token.unreachable: "❌ Couldn't reach {host}. Check the address and that the server is reachable from the internet, then try again."
token.ok: "✅ Hi, <b>@{username}</b>! {host} is connected. Merge requests waiting for your review right now: <b>{count}</b>."
token.readonly: "\n⚠️ This token has no <b>{scope}</b> scope — notifications will work, but the Reply, Approve and Resolve buttons won't."
token.delete_failed: "\n⚠️ I couldn't delete your message with the token — please delete it yourself."
token.unexpected: "🔐 That looks like a token, so I deleted the message to keep it out of the chat history. To connect an account, send /start."
ob.ask_tz: "Last step — your time zone. Quiet hours depend on it:"
btn.tz_other: "Other…"
ob.ask_tz_text: "Send your time zone in IANA format, e.g. <code>America/New_York</code>."
ob.bad_tz: "I don't know that time zone. Example: <code>Europe/Berlin</code>. Try again from /settings."
ob.done: "🎉 All set! Time zone: <b>{tz}</b>. I'll message you when it's your move. Merge requests — /mr, unread — /inbox, settings — /settings."
hint.unknown_text: "I only understand buttons and commands. See /help."
help.text: |-
  <b>Commands</b>
  /inbox — where it's your move and what's unread
  /mr — all your merge requests: to review and your own
  /my — only your own merge requests (author or assignee)
  /accounts — connected GitLab and GitHub accounts
  /settings — notifications, daily summary, quiet hours, language, time zone
  /lang — switch language (RU / EN)
  /start — connect another account
