# GitLab CI (mirror of the GitHub repo): lint + tests on every push/MR, manual deploy on v* tags.
# The image itself is built by GitHub Actions (.github/workflows/release.yml) and pulled from ghcr.io.

stages:
  - check
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

.uv:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  tags: [docker]
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --frozen

lint:
  extends: .uv
  stage: check
  script:
    - uv run ruff check --output-format=gitlab . > gl-code-quality-report.json || (uv run ruff check . && false)
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

test:
  extends: .uv
  stage: check
  script:
    - uv run pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# Shell runner on do-ams3-claude-01. Runs compose as devops (owner of DEPLOY_DIR and its 0600 .env);
# the compose file is fed from the checked-out tag via stdin, so the server copy can't drift.
deploy:
  stage: deploy
  tags: [deploy]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  variables:
    DEPLOY_DIR: /opt/tg-git-notifications-bot
    IMAGE: ghcr.io/isaevdimka/tg-git-notifications-bot
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG#v}"
    - |
      # the GitHub release workflow may still be building the image
      for i in $(seq 1 40); do
        docker manifest inspect "$IMAGE:$IMAGE_TAG" > /dev/null 2>&1 && break
        echo "waiting for $IMAGE:$IMAGE_TAG ($i/40)"; sleep 15
      done
      docker manifest inspect "$IMAGE:$IMAGE_TAG" > /dev/null
    # sudoers allows docker as devops but not passing env, so pin the tag in the file itself
    - compose() { sed "s/\${IMAGE_TAG:-latest}/$IMAGE_TAG/" deploy/docker-compose.prod.yml | sudo -u devops docker compose -f - --project-directory "$DEPLOY_DIR" "$@"; }
    - compose pull
    - compose up -d
    - |
      for i in $(seq 1 24); do
        state=$(docker inspect -f '{{.State.Health.Status}}' tg-git-notifications-bot 2>/dev/null || echo missing)
        echo "health: $state"
        [ "$state" = healthy ] && exit 0
        sleep 5
      done
      docker logs --tail 50 tg-git-notifications-bot
      exit 1
  environment:
    name: production
